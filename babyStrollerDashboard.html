<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Baby Stroller Monitor</title>
<style>
body{font-family:Arial;padding:24px;font-size:20px;}
.error{color:red;font-size:16px;}
</style>
</head>
<body>
  <h2>Smart Baby Stroller Dashboard</h2>
  <p>Temperature: <span id="temp">--</span> °C</p>
  <p>Humidity: <span id="hum">--</span> %</p>
  <p>System Active: <span id="active">--</span></p>
  <p>Hand Present: <span id="hand">--</span></p>
  <p>Rollaway: <span id="roll">--</span></p>
  <p>Belt Fastened: <span id="belt">--</span></p>
  <p>Fan On: <span id="fan">--</span></p>
  <p class="error" id="err"></p>

<script>
const CHANNEL = 3549511;

async function fetchData(){
  const errBox = document.getElementById("err");
  try{
    errBox.textContent = "";
    // public channel：不需要 read key
    let url = `https://api.thingspeak.com/channels/${CHANNEL}/feeds/last.json`;
    console.log("Fetching: ", url);
    let res = await fetch(url);
    if(!res.ok){
      throw new Error("Response not ok: "+ res.status);
    }
    let data = await res.json();
    console.log(data);
    if(!data || !data.field1){
      throw new Error("No feed data, channel empty! ESP not send data yet");
    }
    document.getElementById("temp").innerText = data.field1;
    document.getElementById("hum").innerText = data.field2;
    document.getElementById("active").innerText = data.field3==="1" ? "YES" : "NO";
    document.getElementById("hand").innerText = data.field4==="1" ? "YES" : "NO";
    document.getElementById("roll").innerText = data.field5==="1" ? "YES" : "NO";
    document.getElementById("belt").innerText = data.field6==="1" ? "YES" : "NO";
    document.getElementById("fan").innerText = data.field7==="1" ? "YES" : "NO";
  }catch(e){
    errBox.textContent = "ERROR: " + e.message;
    console.error(e);
  }
}
setInterval(fetchData,15000);
fetchData();
</script>
</body>
</html>
